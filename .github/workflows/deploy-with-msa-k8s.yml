name: deploy wbs msa backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  REGISTRY: 739272173743.dkr.ecr.ap-northeast-2.amazonaws.com
  CLUSTER_NAME: wbs-cluster
  NAMESPACE: wbs-ns

jobs:
  prepare-common:
    runs-on: ubuntu-latest
    outputs:
      common-version: ${{ steps.common.outputs.common-version }}
      common-changed: ${{ steps.common.outputs.common-changed }}
      common-exists: ${{ steps.package.outputs.common-exists }}

    steps:
      - name: checkout github
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ===================== common =====================
      - name: detect common changes
        id: common
        run: |
          COMMON_VERSION="$(cat common/VERSION)"
          echo "common-version=$COMMON_VERSION" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "common-changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q '^common/'; then
            echo "common-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "common-changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: check common package version
        id: package
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
        run: |
          COMMON_VERSION="${{ steps.common.outputs.common-version }}"
          METADATA_URL="https://maven.pkg.github.com/beyond-sw-camp/be23-fin-3team-WBS-devops-be/com/beyond/common/maven-metadata.xml"

          if curl -fsL -u "$GPR_USER:$GPR_TOKEN" "$METADATA_URL" | grep -q "<version>${COMMON_VERSION}</version>"; then
            echo "common-exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "common-exists=false" >> "$GITHUB_OUTPUT"
          fi

  publish-common:
    runs-on: ubuntu-latest
    needs: prepare-common
    if: needs.prepare-common.outputs.common-changed == 'true' && needs.prepare-common.outputs.common-exists == 'false'

    steps:
      - name: checkout github
        uses: actions/checkout@v4

      - name: setup jdk 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: common publish to github packages
        working-directory: ./common
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
          COMMON_VERSION: ${{ needs.prepare-common.outputs.common-version }}
        run: |
          chmod +x ./gradlew
          ./gradlew publish --no-daemon

  build-and-deploy:
    runs-on: ubuntu-latest
    needs:
      - prepare-common
      - publish-common
    if: always() && needs.prepare-common.result == 'success' && (needs.publish-common.result == 'success' || needs.publish-common.result == 'skipped')

    strategy:
      fail-fast: false
      matrix:
        include:
          # ===================== apigateway =====================
          - service: apigateway
            repository: wbs/apigateway
            dockerfile: apigateway/Dockerfile
            manifest: apigateway/k8s/depl_svc.yml
            deployment: apigateway-deployment

          # ===================== account =====================
          - service: account
            repository: wbs/account-service
            dockerfile: account/Dockerfile
            manifest: account/k8s/depl_svc.yml
            deployment: account-deployment

          # ===================== master =====================
          - service: master
            repository: wbs/master-service
            dockerfile: master/Dockerfile
            manifest: master/k8s/depl_svc.yml
            deployment: master-deployment

          # ===================== stock =====================
          - service: stock
            repository: wbs/stock-service
            dockerfile: stock/Dockerfile
            manifest: stock/k8s/depl_svc.yml
            deployment: stock-deployment

          # ===================== search =====================
          - service: search
            repository: wbs/search-service
            dockerfile: search/Dockerfile
            manifest: search/k8s/depl_svc.yml
            deployment: search-deployment

    steps:
      - name: checkout github
        uses: actions/checkout@v4

      - name: configure aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: update cluster information
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: login to ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: ${{ matrix.service }} build and push docker image to ecr
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.repository }}:latest
          build-args: |
            COMMON_VERSION=${{ needs.prepare-common.outputs.common-version }}
          secrets: |
            gpr_user=${{ secrets.GPR_USER }}
            gpr_token=${{ secrets.GPR_TOKEN }}

      - name: ${{ matrix.service }} kubectl apply
        run: |
          kubectl apply -f ./${{ matrix.manifest }}
          kubectl rollout restart deployment ${{ matrix.deployment }} -n "$NAMESPACE"

      - name: ${{ matrix.service }} wait for rollout
        run: kubectl rollout status deployment/${{ matrix.deployment }} -n "$NAMESPACE" --timeout=240s
