server:
  port: ${ACCOUNT_SERVER_PORT:8080}

eureka:
  client:
    enabled: false

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${ACCOUNT_DB_URL}
    username: ${ACCOUNT_DB_USERNAME}
    password: ${ACCOUNT_DB_PASSWORD}

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
    generate-ddl: false
    hibernate:
      ddl-auto: validate
    show_sql: false

  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

jwt:
  expiration: ${JWT_EXPIRATION_MINUTES:30}
  secretKey: ${JWT_SECRET_KEY}
  expirationRt: ${JWT_REFRESH_EXPIRATION_MINUTES:30000}
  secretKeyRt: ${JWT_REFRESH_SECRET_KEY}
