apiVersion: apps/v1
kind: Deployment
metadata:
  name: master-deployment
  namespace: wbs-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: master
  template:
    metadata:
      labels:
        app: master
    spec:
      containers:
      - name: master
        image: 739272173743.dkr.ecr.ap-northeast-2.amazonaws.com/wbs/master-service:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: prod
        - name: MASTER_SERVER_PORT
          value: "8080"
        - name: MASTER_DB_URL
          value: jdbc:mysql://database-1.cliqi2umyj97.ap-northeast-2.rds.amazonaws.com:3306/master_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
        - name: MASTER_DB_USERNAME
          value: wbs_master
        - name: MASTER_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wbs-secrets
              key: MASTER_DB_PASSWORD
        - name: REDIS_HOST
          value: redis-service
        - name: REDIS_PORT
          value: "6379"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka-service:9092
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: wbs-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: wbs-secrets
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_REGION
          value: ap-northeast-2
        - name: AWS_S3_PROFILE_BUCKET
          value: wbs-profile-bucket
        - name: STOCK_SERVICE_URL
          value: http://stock-service
        resources:
          limits:
            cpu: "1"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: master-service
  namespace: wbs-ns
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: master
