server:
  port: ${COMMON_SERVER_PORT:0}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://eureka:8761/eureka/}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${COMMON_DB_URL}
    username: ${COMMON_DB_USERNAME}
    password: ${COMMON_DB_PASSWORD}
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    generate-ddl: false
    hibernate:
      ddl-auto: validate
    show_sql: false
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}

  kafka:
    kafka-server: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${COMMON_KAFKA_GROUP_ID:product-group}

aws:
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket1: ${AWS_S3_PROFILE_BUCKET}
