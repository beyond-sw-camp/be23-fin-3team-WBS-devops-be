server:
  port: ${API_GATEWAY_SERVER_PORT:8080}

eureka:
  client:
    enabled: false

spring:
  cloud:
    gateway:
      httpclient:
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:10s}
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${GATEWAY_ALLOWED_ORIGINS}
            allowedMethods: '*'
            allowedHeaders: '*'
            allowedCredentials: true
      routes:
        - id: account-service
          predicates:
            - Path=/account-service/**
          filters:
            - StripPrefix=1
          uri: ${ACCOUNT_SERVICE_URI:http://account-service}
        - id: master-service
          predicates:
            - Path=/master-service/**
          filters:
            - StripPrefix=1
          uri: ${MASTER_SERVICE_URI:http://master-service}
        - id: stock-service
          predicates:
            - Path=/stock-service/**
          filters:
            - StripPrefix=1
          uri: ${STOCK_SERVICE_URI:http://stock-service}
        - id: search-service
          predicates:
            - Path=/search-service/**
          filters:
            - StripPrefix=1
          uri: ${SEARCH_SERVICE_URI:http://search-service}

jwt:
  secretKey: ${JWT_SECRET_KEY}
