server:
  port: ${AI_SERVER_PORT:8080}

eureka:
  client:
    enabled: false

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${AI_DB_URL}
    username: ${AI_DB_USERNAME}
    password: ${AI_DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${AI_JPA_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}

  ai:
    retry:
      max-attempts: ${SPRING_AI_RETRY_MAX_ATTEMPTS:1}
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: ${OPENAI_CHAT_TEMPERATURE:0.1}
          max-tokens: ${OPENAI_CHAT_MAX_TOKENS:220}
      embedding:
        options:
          model: ${OPENAI_EMBED_MODEL:text-embedding-3-small}

    vectorstore:
      pgvector:
        index-type: ${PGVECTOR_INDEX_TYPE:HNSW}
        distance-type: ${PGVECTOR_DISTANCE_TYPE:COSINE_DISTANCE}
        dimensions: ${PGVECTOR_DIMENSIONS:1536}
        initialize-schema: ${PGVECTOR_INITIALIZE_SCHEMA:true}
        table-name: ${PGVECTOR_TABLE_NAME:vector_store}

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: ${OPENFEIGN_CONNECT_TIMEOUT_MS:3000}
            read-timeout: ${OPENFEIGN_READ_TIMEOUT_MS:120000}
          stock-service:
            connect-timeout: ${STOCK_SERVICE_CONNECT_TIMEOUT_MS:3000}
            read-timeout: ${STOCK_SERVICE_READ_TIMEOUT_MS:120000}
          master-service:
            connect-timeout: ${MASTER_SERVICE_CONNECT_TIMEOUT_MS:3000}
            read-timeout: ${MASTER_SERVICE_READ_TIMEOUT_MS:120000}
          account-service:
            connect-timeout: ${ACCOUNT_SERVICE_CONNECT_TIMEOUT_MS:3000}
            read-timeout: ${ACCOUNT_SERVICE_READ_TIMEOUT_MS:120000}

wms:
  rag:
    auto-ingest:
      enabled: ${RAG_AUTO_INGEST_ENABLED:true}
      location: ${RAG_AUTO_INGEST_LOCATION:classpath:/knowledge/*.txt}
    search:
      top-k: ${RAG_SEARCH_TOP_K:8}
      similarity-threshold: ${RAG_SEARCH_SIMILARITY_THRESHOLD:0.35}
      min-answer-similarity: ${RAG_MIN_ANSWER_SIMILARITY:0.40}
  readonly-datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    jdbc-url: ${WMS_READONLY_DB_URL}
    username: ${WMS_READONLY_DB_USERNAME}
    password: ${WMS_READONLY_DB_PASSWORD}

services:
  stock:
    url: ${STOCK_SERVICE_URL:http://stock-service}
  master:
    url: ${MASTER_SERVICE_URL:http://master-service}
  account:
    url: ${ACCOUNT_SERVICE_URL:http://account-service}

logging:
  level:
    org.springframework.ai: ${LOGGING_LEVEL_SPRING_AI:WARN}
    org.springframework.ai.retry.autoconfigure.SpringAiRetryAutoConfiguration: ERROR
    org.springframework.ai.vectorstore.pgvector: ${LOGGING_LEVEL_PGVECTOR:INFO}
    com.beyond.wbs: ${LOGGING_LEVEL_WBS:INFO}
