apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: wbs-letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: bnm070289@gmail.com
    privateKeySecretRef:
      name: wbs-letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: server-wbs-tls
  namespace: wbs-ns
spec:
  secretName: server-wbs-tls
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    name: wbs-letsencrypt-prod
    kind: ClusterIssuer
  commonName: server.wbs.asia
  dnsNames:
    - server.wbs.asia
