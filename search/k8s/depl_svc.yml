apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-deployment
  namespace: wbs-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
    spec:
      containers:
      - name: search
        image: 739272173743.dkr.ecr.ap-northeast-2.amazonaws.com/wbs/search-service:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: prod
        - name: SEARCH_SERVER_PORT
          value: "8080"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka-service:9092
        - name: SEARCH_KAFKA_GROUP_ID
          value: search-group
        - name: SPRING_ELASTICSEARCH_URIS
          value: http://elasticsearch-service:9200
        resources:
          limits:
            cpu: "1"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: wbs-ns
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: search
