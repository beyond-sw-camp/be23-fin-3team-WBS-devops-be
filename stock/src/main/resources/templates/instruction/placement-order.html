<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title th:text="${'적치지시서 ' + data.sourceNo}">적치지시서</title>
    <style th:inline="text">
        /*<![CDATA[*/
        @page { size: A4; margin: 16mm 14mm 18mm 14mm; }
        body { font-family: 'NanumGothic', sans-serif; font-size: 9pt; color: #1a1a1a; }
        .doc-header { border-bottom: 1.4pt solid #1a1a1a; padding-bottom: 4mm; margin-bottom: 6mm; }
        .doc-header h1 { font-size: 18pt; margin: 0 0 2mm 0; letter-spacing: 1mm; }
        .doc-header .meta-row { font-size: 8.5pt; color: #444; }
        .doc-header .meta-row .left { float: left; }
        .doc-header .meta-row .right { float: right; }
        .doc-header .meta-row:after { content: " "; display: block; clear: both; }
        table.meta { width: 100%; border-collapse: collapse; margin-bottom: 5mm; }
        table.meta th, table.meta td { border: 0.4pt solid #888; padding: 1.6mm 2mm; font-size: 9pt; vertical-align: top; }
        table.meta th { background: #f1f1f1; text-align: left; width: 22mm; font-weight: bold; }
        table.items { width: 100%; border-collapse: collapse; margin-bottom: 4mm; }
        table.items th, table.items td { border: 0.4pt solid #555; padding: 1.4mm 1.8mm; font-size: 9pt; }
        table.items th { background: #2a3a55; color: #ffffff; font-weight: bold; text-align: center; }
        table.items td.num { text-align: right; }
        table.items td.center { text-align: center; }
        table.items td.defect { color: #b03030; font-weight: bold; }
        .summary-row { width: 100%; margin: 2mm 0 6mm 0; font-size: 9.5pt; }
        .summary-row .left { float: left; }
        .summary-row .right { float: right; font-weight: bold; }
        .summary-row:after { content: " "; display: block; clear: both; }
        .doc-footer { margin-top: 8mm; padding-top: 3mm; border-top: 0.4pt solid #888; font-size: 8pt; color: #555; }
        .doc-footer .official-notice { text-align: center; font-weight: bold; color: #1a1a1a; margin-top: 3mm; }
        .reissue-banner { background: #fff4d6; border: 0.6pt solid #c08a00; color: #5a3d00; padding: 2mm 3mm; margin-bottom: 4mm; font-size: 9pt; font-weight: bold; }
        /*]]>*/
    </style>
</head>
<body>

<div class="doc-header">
    <h1>적 치 지 시 서</h1>
    <div class="meta-row">
        <span class="left" th:text="${data.clientName ?: '-'}"></span>
        <span class="right">
            <span th:text="${'문서번호: ' + data.sourceNo}"></span>
            <span th:if="${context.version > 1}" th:text="${' / ' + context.version + '회차'}"></span>
        </span>
    </div>
</div>

<div th:if="${context.version > 1}" class="reissue-banner">
    재발행본 — 회차 <span th:text="${context.version}"></span>.
</div>

<table class="meta">
    <tr>
        <th>입고지시서</th>
        <td th:text="${data.inboundOrderNo ?: '-'}"></td>
        <th>창고</th>
        <td th:text="${data.warehouseName ?: '-'}"></td>
    </tr>
    <tr>
        <th>적치 담당자</th>
        <td th:text="${data.assignedToName ?: '-'}"></td>
        <th>상태</th>
        <td th:text="${data.statusLabel ?: '-'}"></td>
    </tr>
    <tr>
        <th>생성일시</th>
        <td th:text="${data.createdAt != null ? #temporals.format(data.createdAt, 'yyyy-MM-dd HH:mm') : '-'}"></td>
        <th>완료일시</th>
        <td th:text="${data.completedAt != null ? #temporals.format(data.completedAt, 'yyyy-MM-dd HH:mm') : '-'}"></td>
    </tr>
</table>

<table class="items">
    <thead>
    <tr>
        <th style="width: 8mm;">No</th>
        <th style="width: 24mm;">SKU</th>
        <th>상품명</th>
        <th>적치 위치</th>
        <th style="width: 14mm;">수량</th>
        <th style="width: 18mm;">로트</th>
        <th style="width: 14mm;">구분</th>
        <th style="width: 14mm;">완료</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item, iter : ${data.items}">
        <td class="center" th:text="${iter.count}"></td>
        <td class="center" th:text="${item.sku}"></td>
        <td th:text="${item.productName}"></td>
        <td class="center" th:text="${item.locationName}"></td>
        <td class="num" th:text="${#numbers.formatInteger(item.qty, 1, 'COMMA')}"></td>
        <td class="center" th:text="${item.lotNo ?: '-'}"></td>
        <td th:class="${item.isDefect ? 'center defect' : 'center'}" th:text="${item.isDefect ? '불량' : '정상'}"></td>
        <td class="center" th:text="${item.isPlaced ? '✓' : '-'}"></td>
    </tr>
    </tbody>
</table>

<div class="summary-row">
    <span class="left" th:text="${'총 ' + data.items.size() + '건'}"></span>
    <span class="right">
        총 수량 <span th:text="${#numbers.formatInteger(data.totalQty, 1, 'COMMA')}"></span>
        <span th:if="${data.totalDefectQty > 0}">
            · 불량분 <span th:text="${#numbers.formatInteger(data.totalDefectQty, 1, 'COMMA')}"></span>
        </span>
    </span>
</div>

<div class="doc-footer">
    <div class="official-notice">공식 보존본은 본 PDF입니다.</div>
    <div style="text-align: center; margin-top: 1mm;">
        발행일시 <span th:text="${#temporals.format(context.issuedAt, 'yyyy-MM-dd HH:mm')}"></span>
        · 문서ID <span th:text="${context.sourceId}"></span>
    </div>
</div>

</body>
</html>
